<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sisi Liu</title>
<meta name="description" content="Projects, writing and places to find Sisi Liu.">
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.t,main{position:relative;z-index:1}
main{max-width:560px;margin:0 auto;padding:72px 24px 96px}
h1{font-size:28px;font-weight:600;margin:0 0 6px}
.i{color:#666;margin:0 0 48px}
h2{font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:#666;margin:40px 0 12px}
ul{list-style:none;padding:0;margin:0}
li{padding:4px 0}
li span{color:#666}
a{color:#111;text-decoration-color:#bbb;text-underline-offset:3px}
a:hover{text-decoration-color:#111}
.t{display:flex;justify-content:center;gap:48px;padding:24px 20px 0;font:12px/1 Arial,sans-serif;color:#000;font-variant-numeric:tabular-nums}
footer{display:flex;justify-content:space-between;margin-top:64px;padding-top:16px;border-top:1px solid #e5e5e5;color:#666;font-size:14px}
footer button{background:none;border:0;padding:0;font:inherit;color:#666;cursor:pointer;text-decoration:underline;text-decoration-color:#bbb;text-underline-offset:3px}
footer button:hover{color:#111;text-decoration-color:#111}
@media(max-width:480px){body{font-size:16px}main{padding:48px 20px 72px}h1{font-size:24px}.i{margin-bottom:36px}.t{gap:40px;padding-top:20px}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="t"><span id="d"></span><span id="h"></span></div>
<main>
<h1>Sisi Liu</h1>
<p class="i">creative technologist<br>munich, düsseldorf, beijing</p>
<h2>Projects</h2>
<ul>
<li><a href="https://sisiliu10.github.io/sisis-garden/">sisi's garden</a> <span>– a pixel habit tracker: show up daily, watch your garden grow</span></li>
</ul>
<h2>Writing</h2>
<ul>
<li><a href="https://sisliu.substack.com/">substack</a></li>
</ul>
<h2>Socials</h2>
<ul>
<li><a href="https://www.instagram.com/sisi.i03/">instagram</a></li>
<li><a href="https://www.linkedin.com/in/sisi-liu-5108b31b6/">linkedin</a></li>
<li><a href="https://github.com/sisiliu10">github</a></li>
</ul>
<footer><span>© 2026 Sisi Liu</span><button id="x" hidden>clear drawing</button></footer>
</main>
<script>
const p=n=>String(n).padStart(2,'0');
function t(){const d=new Date();document.getElementById('d').textContent=p(d.getMonth()+1)+'/'+p(d.getDate())+'/'+d.getFullYear();document.getElementById('h').textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())}
t();setInterval(t,1000);
(()=>{
const c=document.getElementById('c'),g=c.getContext('2d'),b=document.getElementById('x'),K='sisi-draw',C=['#0033ff','#ffc800','#e3000f','#111'];
let W,H,S=[],cur=null,ci=0,last=0,tm;
try{const v=JSON.parse(localStorage.getItem(K));if(v&&Array.isArray(v.s)){S=v.s;ci=v.c||0}}catch(e){}
function seg(s,i){const q=s.p,a=q[Math.max(i-2,0)],m=q[i-1],n=q[i];g.strokeStyle=s.c;g.lineWidth=n[2];g.beginPath();g.moveTo((a[0]+m[0])/2*W,(a[1]+m[1])/2*H);g.quadraticCurveTo(m[0]*W,m[1]*H,(m[0]+n[0])/2*W,(m[1]+n[1])/2*H);g.stroke()}
function draw(){g.clearRect(0,0,W,H);S.forEach(s=>{for(let i=1;i<s.p.length;i++)seg(s,i)});b.hidden=!S.length}
function size(){const r=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*r;c.height=H*r;g.setTransform(r,0,0,r,0,0);g.lineCap='round';g.lineJoin='round';draw()}
function save(){clearTimeout(tm);tm=setTimeout(()=>{let n=S.reduce((a,s)=>a+s.p.length,0),cut=0;while(n>8000&&S.length>1){n-=S.shift().p.length;cut=1}if(cut)draw();try{localStorage.setItem(K,JSON.stringify({s:S,c:ci}))}catch(e){}},500)}
function add(X,Y){const now=performance.now();if(!cur||now-last>300){cur={c:C[ci],p:[]};S.push(cur);b.hidden=false}
const q=cur.p,o=q[q.length-1];let w=2.4;
if(o){const d=Math.hypot(X-o[0]*W,Y-o[1]*H);if(d<2)return;const v=d/Math.max(now-last,1);w=o[2]*.7+Math.max(1,Math.min(3.4,3.4-v*1.2))*.3}
q.push([+(X/W).toFixed(4),+(Y/H).toFixed(4),+w.toFixed(2)]);last=now;if(q.length>1)seg(cur,q.length-1);save()}
addEventListener('pointermove',e=>{if(e.pointerType!=='touch')add(e.clientX,e.clientY)});
document.documentElement.addEventListener('mouseleave',()=>cur=null);
addEventListener('touchmove',e=>{const f=e.touches[0];add(f.clientX,f.clientY)},{passive:true});
addEventListener('touchend',()=>cur=null);
addEventListener('click',e=>{if(e.target.closest('a,button'))return;ci=(ci+1)%C.length;cur=null;save()});
b.addEventListener('click',()=>{S=[];cur=null;draw();try{localStorage.removeItem(K)}catch(e){}});
addEventListener('resize',size);size();
})();
</script>
</body>
</html>
